services:
  postgres:
    image: postgres:16-alpine
    container_name: admission_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admission_user
      POSTGRES_PASSWORD: admission_password
      POSTGRES_DB: admissions_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission_user -d admissions_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
